
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 id="heading">Event Registration</h1>
        <br></br>
        <p>Register for your favourite college events!</p>
        <br></br>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
    </nav>

    <h2>Student Registration Form</h2>
    <br></br>

    <button onclick="changeFont()">
        Change Heading Font Size
    </button>

    <button onclick="toggleForm()">
        Show / Hide Form
    </button>

    <div id="registrationForm">

        <form id="studentForm" novalidate>

            <label>Student Name:</label>
            <input type="text" id="studentName"
                   placeholder="Enter your name">
                   <br></br>

            <label>Student Roll Number:</label>
            <input type="text" id="rollNumber"
                   placeholder="Enter roll number">
                   <br></br>

            <label>Email Address:</label>
            <input type="email" id="email"
                   placeholder="Enter your email">
                   <br></br>

            <label>Select Event:</label>
            <select id="event">
                <option value="">-- Select Event --</option>
                <option value="Tech Fest">Tech Fest</option>
                <option value="Cultural Fest">Cultural Fest</option>
                <option value="AI Workshop">AI Workshop</option>
                <option value="Sports Meet">Sports Meet</option>
            </select>

            <button type="submit">Register</button>

        </form>

    </div>

    <p id="message" role="status" aria-live="polite"></p>

    <script src="script.js"></script>

</body>
</html>
