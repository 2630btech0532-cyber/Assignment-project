<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <h1 id="heading">Student Dashboard</h1>

        <div class="header-buttons">
            <button id="changeHeading">Change Heading</button>
            <button id="lightMode">Light Mode</button>
            <button id="darkMode">Dark Mode</button>
        </div>

    </header>


    <main class="container">

        <!-- Student Information -->

        <section class="cards">

            <div class="card">
                <h2>Student Information</h2>

                <p><strong>Name:</strong> Anshika Chaudhary</p>
                <p><strong>Course:</strong> B.Tech CSE-AI</p>
                <p><strong>Semester:</strong> 1st Semester</p>
            </div>


            <!-- Top Student -->

            <div class="card top-student">

                <h2>Top Student</h2>

                <p id="topStudent">
                    Loading...
                </p>

            </div>

        </section>


        <!-- Table Controls -->

        <section class="table-section">

            <button id="toggleTable">
                Hide Student Table
            </button>

            <div id="studentTableContainer">

                <h2>Student Performance</h2>

                <table id="studentTable">

                    <thead>

                        <tr>
                            <th>Roll No.</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Semester</th>
                            <th>Marks</th>
                        </tr>

                    </thead>

                    <tbody id="studentTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <footer>

        <p>Student Portal | Web Development Assignment</p>

    </footer>


    <script src="portal.js"></script>

</body>

</html>
